id: bq_trends
name: Google Trends (BigQuery public dataset)
owner: Google
# The provider pins bigquery.googleapis.com (queries) and oauth2.googleapis.com (tokens) and reads only
# bigquery-public-data.google_trends.international_top_terms / international_top_rising_terms for country_code 'TR'.
base_url: https://bigquery.googleapis.com/bigquery/v2/
access: rest_api
auth:
  type: oauth
  # BQ_PROJECT_ID = billing project; credentials from GOOGLE_APPLICATION_CREDENTIALS or the gcloud ADC file.
  env_vars: [BQ_PROJECT_ID, GOOGLE_APPLICATION_CREDENTIALS]
rate_limit: {rps: 2, backoff: exponential, notes: "Tablolar refresh_date ile bölümlenmiş ama kümelenmemiştir; liste sorgusu gün başına yaklaşık 0,25 GiB tarar (35 gün: 7,8 GiB, 2026-11-03 ölçümü). Listeler 7 günlük parçalarla (yaklaşık 1,75 GiB) ve yalnızca eksik günler için çekilir; ilk çekim yaklaşık 8 GiB, sonraki günlük güncellemeler yaklaşık 1 GiB tarar. Her sorgu maximumBytesBilled tavanı taşır (BQ_MAX_BYTES_BILLED, varsayılan 5 GiB). BigQuery ayda 1 TiB sorguyu ücretsiz işler; sandbox projelerinde fatura hesabı gerekmez."}
# Upstream keeps 30 daily lists: the history of count series exists only in the local store. revision_days makes
# FetchSeries serve the stored range and ask the source only for the last 3 days before the newest stored day (each
# listed day costs ~0.25 GiB); interest series always return their whole rescaled backfill. default_years: start
# without --start.
history: {default_years: 5, revision_days: 3}
license: {attribution: required, notes: "Google Trends verisi BigQuery public dataset programı kapsamında 'olduğu gibi', garanti verilmeden sunulur; kullanım Google Hizmet Şartları'na tabidir. Açık bir lisans (ör. CC-BY) yayımlanmamıştır; ticari kullanım koşulları doğrulanmadı. Yayımlarken 'Kaynak: Google Trends' atfı verin. Sorgular kullanıcının kendi Google Cloud projesine faturalanır."}
# Keep raw query responses out of bronze (their URL carries the user's project id); the silver store keeps the
# observations, so the 30-day upstream window accumulates into a longer local history.
storage: {raw: false, observations: true}
frequency: [D, W]
formats: [json]
sectors: [makro_genel, akaryakit, bankacilik, otomotiv, telekom]
publication_lag_days: 2  # live 2026-11-03: the newest partition was 2026-11-01
verification_status: verified
verification_notes: "2026-11-03: Canlı doğrulandı (kullanıcının Google Cloud projesi, ADC ile). Tablolar refresh_date ile günlük bölümlenmiş, kümelenmemiş, konum US; international_top_terms yaklaşık 15,5 GiB. Türkiye (TR) kapsanıyor: her gün 25 terim, her terim için 81 il × 261 hafta (5 yıl) skor; ülke düzeyinde satır yok, düşük hacimli hafta ve illerde skor boş (null). En yeni bölüm iki gün geriden geliyor (3 Kasım'da 1 Kasım). Ekim 2026 öncesindeki bölümler neredeyse boş; saklama yaklaşık 30 gün. Liste sorgusu gün başına yaklaşık 0,25 GiB, tek terimin ilgi sorgusu yaklaşık 0,3 GiB tarıyor."
known_breaks: ["Kaynakta yalnızca son ~30 günün listeleri tutulur; 'count' serilerinin daha eski geçmişi yalnızca yerel depoda, ilk çekimden itibaren birikir", "'interest' skorları her yenilemede 5 yıllık seri yeniden ölçeklenerek yayımlanır (en yüksek hafta = 100); eski haftalar revize olur ve terim yalnızca listeye girdiği için görünür (seçim yanlılığı)"]
adapter: bq_trends
priority: 30
# remote: "<top|rising>,<count|interest>/<KEY>[+<KEY>...]"; KEY = lower-case ASCII, '_' = space, Turkish letters
# folded (ı→i, ş→s, ...).
# - count: per refresh_date, number of terms in the Türkiye list that contain a keyword at a word start (D).
# - interest: weekly score of one term (KEYs = spellings); total = mean over regions, regions as entities (W).
# Ad hoc: BQT.ILGI.<TERM> without a seed = top,interest/<term>.
series:
  - {code: BQT.TOP.EKONOMI.SAYI, name: "Google Trends Türkiye günlük Top 25 listesinde ekonomi terimi sayısı (dolar, altın, faiz, enflasyon, zam, asgari ücret, emekli, memur, kredi, borsa)", freq: D, kind: level, unit: count, remote: "top,count/dolar+euro+altin+faiz+enflasyon+zam+asgari+emekli+memur+kredi+borsa+bitcoin", canary: true}
  - {code: BQT.RISING.EKONOMI.SAYI, name: "Google Trends Türkiye günlük Top 25 Rising listesinde ekonomi terimi sayısı", freq: D, kind: level, unit: count, remote: "rising,count/dolar+euro+altin+faiz+enflasyon+zam+asgari+emekli+memur+kredi+borsa+bitcoin"}
  - {code: BQT.TOP.AKARYAKIT.SAYI, name: "Google Trends Türkiye günlük Top 25 listesinde akaryakıt terimi sayısı (benzin, motorin, mazot, akaryakıt, LPG)", freq: D, kind: level, unit: count, remote: "top,count/benzin+motorin+mazot+akaryakit+lpg+petrol"}
  - {code: BQT.TOP.BANKA.SAYI, name: "Google Trends Türkiye günlük Top 25 listesinde bankacılık terimi sayısı (banka, kredi, kart, mevduat, faiz)", freq: D, kind: level, unit: count, remote: "top,count/banka+kredi+kart+mevduat+faiz+ziraat+halkbank+vakifbank+garanti+akbank+yapi_kredi+is_bankasi"}
  - {code: BQT.TOP.OTOMOTIV.SAYI, name: "Google Trends Türkiye günlük Top 25 listesinde otomotiv terimi sayısı (otomobil, araba, ÖTV, Togg, marka adları)", freq: D, kind: level, unit: count, remote: "top,count/otomobil+araba+otv+togg+fiat+renault+toyota+hyundai+volkswagen+ford+tesla+byd"}
  - {code: BQT.TOP.TELEKOM.SAYI, name: "Google Trends Türkiye günlük Top 25 listesinde telekom terimi sayısı (Turkcell, Vodafone, Türk Telekom, internet, iPhone)", freq: D, kind: level, unit: count, remote: "top,count/turkcell+vodafone+turk_telekom+turknet+superonline+internet+iphone"}
  - {code: BQT.ILGI.TOGG, name: "Google Trends arama ilgisi: togg (haftalık, bölge ortalaması; terim listedeyken güncellenir)", freq: W, kind: level, unit: index_0_100, publication_lag_days: 2, remote: "top,interest/togg"}
