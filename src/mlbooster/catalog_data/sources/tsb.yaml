  - {code: TSB.PRIM.TOPLAM.YTD, name: "Toplam prim üretimi (hayat ve hayat dışı), şirket bazında, yıl başından itibaren birikimli (TL)", freq: M, kind: level, unit: TRY, currency: TRY, remote: "PRIM_URETIMLERI_SIRALAMA/GENEL_TOPLAM.YTD"}
