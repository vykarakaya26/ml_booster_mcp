id: bkm
name: BKM kartlı ödeme istatistikleri
owner: Bankalararası Kart Merkezi
# The provider pins this host and reads the "Dönemsel Bilgiler" report pages (one GET per report, full history).
base_url: https://bkm.com.tr
access: file_download
auth: {type: none}
rate_limit: {rps: 1, backoff: exponential, notes: "Her rapor sayfası 2017'den bu yana bütün ayları tek yanıtta döndürür."}
license: {commercial: false, redistribution: false, attribution: required, notes: "Raporlar sayfası: \"Raporlar BKM kaynak gösterilmeksizin yayınlanamaz.\" Sitenin genel yasal uyarısı (bkm.com.tr/bkm/yasal-uyari/) bilgilerin yalnızca bilgi edinmek amacıyla kullanılabileceğini; BKM'nin önceden yazılı izni olmadan kopyalanamayacağını, dağıtılamayacağını, ileride kullanılmak üzere saklanamayacağını ve ticari amaçla kullanılamayacağını belirtir. Kaynak göstermeden yayımlamayın; ticari kullanım, yeniden dağıtım ve kalıcı saklama için BKM'den (destek@bkm.com.tr) yazılı izin alın."}
frequency: [M]
formats: [html]
sectors: [bankacilik, perakende, turizm, eticaret]
publication_lag_days: 40  # Aug 2026 out and Sep 2026 not out on 2 Nov 2026; May 2026 out by 10 Jul 2026 (web archive)
verification_status: verified
verification_notes: "2026-11-02: Dönemsel Bilgiler rapor sayfaları anahtarsız olarak canlı test edildi (sunucu tarafında üretilen HTML, yıl başına bir tablo, Ocak 2017'den Ağustos 2026'ya kadar). Ağustos 2026 kart sayıları ve işlem tutarları 'Seçilen Aya Ait Genel İstatistik' raporuyla birebir aynı; sektör raporlarının toplamı genel rapordaki yerli ve yabancı kartların yurt içi alışveriş toplamına eşit. Excel indirmesi aynı HTML tablodur. robots.txt yalnızca /wp-admin/ yolunu kapatıyor. Banka bazında veri yayımlanmıyor."
known_breaks: ["2017-01: Sitedeki aylık raporlar 2017'de başlıyor; daha eski yıllar yalnızca yıllık faaliyet raporlarında yer alır", "2025-03/04: Ön ödemeli kart sayısında tanım kaynaklı düşüş, banka kartı sayısında artış (Mart 2025 112,7 milyon → Nisan 2025 101,1 milyon)"]
adapter: bkm
priority: 10
# remote: "<report slug>[,<filter_group>]/<COLUMN>[+<COLUMN>...]"; COLUMN joins the header keys from top to bottom and
# several columns are summed. Merchant groups (filter_group of secilen-sektore-gore-aylik-gelisim): 2 araç
# kiralama-satış/servis/yedek parça, 3 benzin ve yakıt istasyonları, 4 havayolları, 5 seyahat acenteleri/taşımacılık,
# 6 konaklama, 10 yemek, 11 giyim ve aksesuar, 12 market ve alışveriş merkezleri, 14 elektrik-elektronik eşya,
# bilgisayar, 15 telekomünikasyon, 17 sigorta (full list on the report page). Sector figures are shopping transactions
# of domestic and foreign cards in Türkiye.
series:
