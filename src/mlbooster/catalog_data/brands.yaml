# Name knowledge used to resolve a brand against the entity-level sources (application/use_cases/brand.py).
# Tokens are written folded (ASCII lower case). Entity ids must match the ids the source's provider returns.
legal_tokens: [as, tas, tao, ao, ltd, sti, san, tic, sa, se, na, spa, plc, inc, llc, gmbh, ag]
generic_tokens:
  - ve
  - anonim
  - sirketi
  - sirket
  - turk
  - turkiye
  - turkey
  - cumhuriyeti
  - tc
  - banka
  - bankasi
  - bank
  - yatirim
  - kalkinma
  - sigorta
  - sigortasi
  - sigortacilik
  - hayat
  - emeklilik
  - yasam
  - saglik
  - grup
  - grubu
  - holding
  - petrol
  - petrolculuk
  - petrolleri
  - akaryakit
  - enerji
  - gaz
  - lpg
  - likit
  - dagitim
  - otomotiv
sector_keywords:
  bankacilik: [banka, bankasi, bank, katilim]
  sigorta: [sigorta, emeklilik, reasurans]
  otomotiv: [otomotiv, oto, motor, motors, araba, arac]
  akaryakit: [petrol, akaryakit, lpg, otogaz]
  telekom: [telekom, iletisim, internet, mobil, gsm]
  perakende: [market, marketleri, magaza, magazacilik, perakende, giyim, tekstil, kozmetik, eticaret, restoran, gida]
  turizm: [turizm, otel, tur, seyahat, havayolu, havayollari]
  konut: [konut, insaat, gayrimenkul, emlak, yapi]
