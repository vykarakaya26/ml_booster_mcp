id: makro_genel
name: Makro (genel, günlük/haftalık/aylık)
macro_features:
  - {name: usdtry_logdiff, source: evds3, series: TP.DK.USD.A, transform: log_diff, agg: avg}
  - {name: usdtry_son, source: evds3, series: TP.DK.USD.A, transform: level, agg: last}
  - {name: bist100_logdiff, source: evds3, series: TP.MK.F.BILESIK, transform: log_diff, agg: last}
  - {name: tlref, source: evds3, series: TP.BISTTLREF.ORAN, transform: level, agg: avg}
  - {name: aofm, source: evds3, series: TP.APIFON4, transform: level, agg: avg}
  - {name: rezerv_logdiff, source: evds3, series: TP.AB.TOPLAM, transform: log_diff, agg: last}
  - {name: m2_yoy, source: evds3, series: TP.HPBITABLO1.11, transform: yoy_pct, agg: last}
  - {name: kart_toplam_reel_yoy, source: evds3, series: TP.KKHARTUT.KT1, transform: yoy_pct, agg: avg, real: true}
  - {name: tufe_yoy, source: evds3, series: TP.TUKFIY2025.GENEL, transform: yoy_pct}
  - {name: ufe_yoy, source: evds3, series: TP.TUFE1YI.T1, transform: yoy_pct}
  - {name: pka_enflasyon_beklentisi, source: evds3, series: TP.ENFBEK.PKA12ENF, transform: level}
  - {name: sanayi_uretim_yoy, source: evds3, series: TP.TSANAYMT2021.BCD, transform: yoy_pct}
  - {name: kapasite_kullanim, source: evds3, series: TP.KKO.MA, transform: level}
  - {name: tuketici_guveni, source: evds3, series: TP.TG2.Y01, transform: level}
  - {name: politika_faizi, source: bis, series: BIS.CBPOL.TR.D, transform: level, agg: last}
  - {name: reel_efektif_kur, source: bis, series: BIS.REER.TR, transform: level}
  - {name: oecd_oncu_gosterge, source: oecd, series: OECD.CLI.TR, transform: level}
  - {name: oecd_is_guveni, source: oecd, series: OECD.BCI.TR, transform: level}
  - {name: elektrik_tuketimi_yoy, source: epias, series: EPIAS.TUKETIM, transform: yoy_pct, agg: sum}
  - {name: ptf_yoy, source: epias, series: EPIAS.PTF, transform: yoy_pct, agg: avg}
  - {name: google_ekonomi_gundemi, source: bq_trends, series: BQT.TOP.EKONOMI.SAYI, transform: level, agg: avg}  # search-interest proxy; history accumulates locally (30-day upstream window)
sector_sources: [epias]
market_share_sources: []
ml_use_cases: ["Makro nowcasting", "Rejim tespiti", "Feature havuzu"]
feature_recipes:
  - {name: reel_faiz_ex_ante, op: spread, inputs: [aofm, pka_enflasyon_beklentisi], note: "İleriye dönük reel faiz"}
  - {name: reel_faiz_ex_post, op: spread, inputs: [aofm, tufe_yoy], note: "Gerçekleşen reel faiz"}
  - {name: aofm_politika_farki, op: spread, inputs: [aofm, politika_faizi], note: "Efektif politika duruşu"}
  - {name: ufe_tufe_farki, op: spread, inputs: [ufe_yoy, tufe_yoy], note: "Maliyet baskısı"}
  - {name: beklenti_gerceklesme_farki, op: spread, inputs: [pka_enflasyon_beklentisi, tufe_yoy], note: "Beklenen ve gerçekleşen enflasyon farkı (dezenflasyon beklentisi)"}
  - {name: reel_kur_sapma_12, op: gap, inputs: [reel_efektif_kur], window: 12, note: "Reel kur sapması"}
