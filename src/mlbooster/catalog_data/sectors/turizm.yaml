id: turizm
name: Turizm / Seyahat
macro_features:
  - {name: eurtry_logdiff, source: evds3, series: TP.DK.EUR.A, transform: log_diff, agg: avg}
  - {name: kart_konaklama_reel_yoy, source: evds3, series: TP.KKHARTUT.KT12, transform: yoy_pct, agg: avg, real: true}
  - {name: kart_havayolu_reel_yoy, source: evds3, series: TP.KKHARTUT.KT10, transform: yoy_pct, agg: avg, real: true}
  - {name: kart_seyahat_reel_yoy, source: evds3, series: TP.KKHARTUT.KT20, transform: yoy_pct, agg: avg, real: true}
  - {name: tufe_yoy, source: evds3, series: TP.TUKFIY2025.GENEL, transform: yoy_pct}
  - {name: yabanci_ziyaretci, source: evds3, discover_hint: "Kültür ve Turizm Bakanlığı sınır istatistikleri EVDS'de bulunamadı; turizm gelirleri ödemeler dengesinde cari işlemlerin alt kalemi olarak yer alır"}
  - {name: reel_efektif_kur, source: bis, series: BIS.REER.TR, transform: level}
sector_sources: [bkm]
market_share_sources:
  - {source: bkm, metric: "konaklama, havayolu ve seyahat kart harcaması (talep proxy'si)", is_proxy: true}
ml_use_cases: ["Talep tahmini", "Sezon planlama", "Kur duyarlılığı"]
feature_recipes:
  - {name: reel_kur_sapma_12, op: gap, inputs: [reel_efektif_kur], window: 12, note: "Reel efektif kurun son 12 ay ortalamasından sapması (fiyat rekabetçiliği)"}
  - {name: seyahat_konaklama_farki, op: spread, inputs: [kart_seyahat_reel_yoy, kart_konaklama_reel_yoy], note: "Seyahat acentesi ve konaklama harcaması arasındaki büyüme farkı"}
  - {name: havayolu_z_24, op: zscore, inputs: [kart_havayolu_reel_yoy], window: 24, note: "Havayolu harcamasının son 24 aya göre z-score'u"}
