id: telekom
name: Telekom
macro_features:
  - {name: tufe_yoy, source: evds3, series: TP.TUKFIY2025.GENEL, transform: yoy_pct}
  - {name: usdtry_logdiff, source: evds3, series: TP.DK.USD.A, transform: log_diff, agg: avg}
  - {name: haberlesme_tufe, source: tuik, discover_hint: "TÜFE haberleşme alt endeksi (2025=100, ECOICOP v2 köprüsü gerekir)"}
  - {name: kart_telekom_reel_yoy, source: evds3, series: TP.KKHARTUT.KT22, transform: yoy_pct, agg: avg, real: true}
  - {name: kart_elektronik_reel_yoy, source: evds3, series: TP.KKHARTUT.KT8, transform: yoy_pct, agg: avg, real: true}
sector_sources: [btk]
market_share_sources:
  - source: btk
    metric: "mobil abone payı, işletmeci net satış gelirleri, sabit genişbant abone ve gelir payları (çeyreklik Pazar Verileri Raporu)"
    series: [BTK.MOBIL.ABONE.PAY, BTK.GELIR, BTK.SGB.ABONE.PAY, BTK.SGB.GELIR.PAY]
    notes: "Numara taşıma ve churn raporda yalnızca grafik olarak yayımlanıyor"
ml_use_cases: ["ARPU tahmini", "Churn", "Abone büyümesi"]
feature_recipes:
  - {name: goreli_haberlesme_fiyati, op: spread, inputs: [haberlesme_tufe, tufe_yoy], note: "Haberleşme fiyat artışı − genel enflasyon (fiyatlama gücü; seri bağlandığında)"}
  - {name: elektronik_telekom_farki, op: spread, inputs: [kart_elektronik_reel_yoy, kart_telekom_reel_yoy], note: "Cihaz ve hizmet harcaması arasındaki büyüme farkı"}
  - {name: kart_telekom_z_24, op: zscore, inputs: [kart_telekom_reel_yoy], window: 24, note: "Telekom harcamasının son 24 aya göre z-score'u"}
