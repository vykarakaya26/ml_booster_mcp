id: sigorta
name: Sigorta
macro_features:
  - {name: tufe_yoy, source: evds3, series: TP.TUKFIY2025.GENEL, transform: yoy_pct}
  - {name: usdtry_logdiff, source: evds3, series: TP.DK.USD.A, transform: log_diff, agg: avg}
  - {name: eurtry_logdiff, source: evds3, series: TP.DK.EUR.A, transform: log_diff, agg: avg}
  - {name: tasit_kredisi_hacmi, source: evds3, discover_hint: "Sektörel / taşıt kredisi hacmi"}
  - {name: kart_sigorta_reel_yoy, source: evds3, series: TP.KKHARTUT.KT21, transform: yoy_pct, agg: avg, real: true}
  - {name: osd_binek_uretim_yoy, source: evds3, series: TP.UR.S08, transform: yoy_pct}
  - {name: prim_uretimi_reel_yoy, source: tsb, series: TSB.PRIM.TOPLAM, transform: yoy_pct, real: true}  # sector total (aggregate rows only)
sector_sources: [tsb, odmd]
market_share_sources:
  - {source: tsb, metric: "prim üretimi payı, şirket bazında, yıl başından birikimli (TSB.PRIM.TOPLAM.YTD, *.HAYATDISI.YTD, *.HAYAT.YTD, *.TRAFIK.YTD, *.KASKO.YTD, *.SAGLIK.YTD, *.YANGIN.YTD ...); aylık seriler (TSB.PRIM.*) panel ve tahmin içindir"}
ml_use_cases: ["Prim tahmini", "Hasar enflasyonu", "Fiyatlama"]
feature_recipes:
  - {name: kur_sepeti_logdiff, op: mean, inputs: [usdtry_logdiff, eurtry_logdiff], note: "Hasar maliyetinde ithal parça payı için kur sepeti"}
  - {name: tufe_sapma_12, op: gap, inputs: [tufe_yoy], window: 12, note: "Enflasyon momentum'u; prim tavanı ile hasar enflasyonu arasındaki açığın göstergesi"}
  - {name: binek_uretim_z_24, op: zscore, inputs: [osd_binek_uretim_yoy], window: 24, note: "Yeni araç arzı (kasko portföyü büyümesi)"}
events:
  - {name: deprem_2023_02, start: "2023-02", kind: pulse, note: "6 Şubat 2023 Kahramanmaraş depremleri: DASK ve yangın branşlarında talep ve hasar şoku"}
