id: bankacilik
name: Bankacılık
macro_features:
  - {name: aofm, source: evds3, series: TP.APIFON4, transform: level, agg: avg}
  - {name: aofm_son, source: evds3, series: TP.APIFON4, transform: level, agg: last}  # month-end value: anchor for the monthly-average target
  - {name: usdtry_logdiff, source: evds3, series: TP.DK.USD.A, transform: log_diff, agg: avg}
  - {name: tufe_yoy, source: evds3, series: TP.TUKFIY2025.GENEL, transform: yoy_pct}
  - {name: dis_borc_logdiff, source: evds3, series: TP.BRUTDBORCLU.G1, transform: log_diff}
  - {name: kredi_faizi, source: evds3, discover_hint: "Ticari ve tüketici kredi faizleri veri grubu: /serieList ya da EVDS-MCP list_series ile bulunabilir"}
  - {name: mevduat_faizi, source: evds3, discover_hint: "TL mevduat faizleri (vadeye göre) veri grubu"}
  - {name: pka_enflasyon_beklentisi, source: evds3, series: TP.ENFBEK.PKA12ENF, transform: level}
  - {name: kredi_karti_sayisi_yoy, source: bkm, series: BKM.KART.KREDI, transform: yoy_pct}
  - {name: kredi_karti_harcama_reel_yoy, source: bkm, series: BKM.KK.YURTICI.TUTAR, transform: yoy_pct, real: true}
  - {name: tlref, source: evds3, series: TP.BISTTLREF.ORAN, transform: level, agg: avg}
  - {name: m2_yoy, source: evds3, series: TP.HPBITABLO1.11, transform: yoy_pct, agg: last}
  - {name: rezerv_logdiff, source: evds3, series: TP.AB.TOPLAM, transform: log_diff, agg: last}
  - {name: bist100_logdiff, source: evds3, series: TP.MK.F.BILESIK, transform: log_diff, agg: last}
  - {name: politika_faizi, source: bis, series: BIS.CBPOL.TR.D, transform: level, agg: last}
  - {name: kredi_gsyh, source: bis, series: BIS.KREDI.GSYH.TR, transform: level}
sector_sources: [bddk, tbb]
market_share_sources:
  - source: tbb
    metric: "banka bazında paylar: aktif, kredi, mevduat, özkaynak (çeyreklik solo mali tablolar, katılım bankaları hariç)"
    series: [TBB.AKTIF, TBB.KREDI, TBB.MEVDUAT, TBB.OZKAYNAK, TBB.MEVDUAT.TP]
  - source: bddk
    metric: "banka grubu payları: aktif, kredi, mevduat, özkaynak (aylık bülten)"
    series: [BDDK.AKTIF, BDDK.KREDI, BDDK.MEVDUAT, BDDK.OZKAYNAK, BDDK.AKTIF.SAHIPLIK, BDDK.KREDI.SAHIPLIK, BDDK.MEVDUAT.SAHIPLIK, BDDK.KREDI.TP, BDDK.MEVDUAT.TP]
    entities_from: [BDDK.AKTIF, BDDK.AKTIF.SAHIPLIK]
ml_use_cases: ["Kredi riski (PD)", "Mevduat ve kredi hacmi tahmini", "Churn"]
feature_recipes:
  - {name: reel_faiz_ex_ante, op: spread, inputs: [aofm, pka_enflasyon_beklentisi], note: "Efektif fonlama maliyeti − 12 ay sonrası enflasyon beklentisi (ex-ante reel faiz)"}
  - {name: reel_faiz_ex_post, op: spread, inputs: [aofm, tufe_yoy], note: "Efektif fonlama maliyeti − yıllık TÜFE (ex-post reel faiz)"}
  - {name: aofm_politika_farki, op: spread, inputs: [aofm, politika_faizi], note: "AOFM − politika faizi; haftalık repo ihalesine ara verilen dönemlerde pozitife döner"}
  - {name: tlref_aofm_farki, op: spread, inputs: [tlref, aofm], note: "Gecelik piyasa faizi ile fonlama maliyeti arasındaki fark"}
  - {name: kredi_mevduat_farki, op: spread, inputs: [kredi_faizi, mevduat_faizi], note: "Net faiz marjı göstergesi (seri kodları bağlandığında hesaplanır)"}
  - {name: tufe_sapma_12, op: gap, inputs: [tufe_yoy], window: 12, note: "Yıllık enflasyonun son 12 ay ortalamasından sapması"}
