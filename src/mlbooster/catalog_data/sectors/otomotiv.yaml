id: otomotiv
name: Otomotiv
macro_features:
  - {name: usdtry_logdiff, source: evds3, series: TP.DK.USD.A, transform: log_diff, agg: avg}
  - {name: eurtry_logdiff, source: evds3, series: TP.DK.EUR.A, transform: log_diff, agg: avg}
  - {name: tufe_yoy, source: evds3, series: TP.TUKFIY2025.GENEL, transform: yoy_pct}
  - {name: aofm, source: evds3, series: TP.APIFON4, transform: level, agg: avg}
  - {name: aofm_son, source: evds3, series: TP.APIFON4, transform: level, agg: last}
  - {name: tasit_kredisi_faizi, source: evds3, discover_hint: "Taşıt kredisi faiz oranı"}
  - {name: tuketici_guveni, source: evds3, discover_hint: "Tüketici güven endeksi"}
  - {name: osd_binek_uretim_yoy, source: evds3, series: TP.UR.S08, transform: yoy_pct}
  - {name: kart_arac_reel_yoy, source: evds3, series: TP.KKHARTUT.KT3, transform: yoy_pct, agg: avg, real: true}
  - {name: kapasite_kullanim, source: evds3, series: TP.KKO.MA, transform: level}
sector_sources: [odmd]
market_share_sources:
  - {source: odmd, metric: "marka bazında satış adedi payı: otomobil, hafif ticari, toplam; yerli/ithal kırılımı (aylık; ODMD.TOPLAM, ODMD.OTOMOBIL, ODMD.HAFIF_TICARI)"}
ml_use_cases: ["Talep ve satış tahmini", "Fiyat esnekliği"]
feature_recipes:
  - {name: kur_sepeti_logdiff, op: mean, inputs: [usdtry_logdiff, eurtry_logdiff], note: "Eşit ağırlıklı USD/EUR sepeti; ithal araç ve parça maliyetini temsil eder"}
  - {name: reel_tasit_kredisi_faizi, op: spread, inputs: [tasit_kredisi_faizi, tufe_yoy], note: "Taşıt kredisi faizi − yıllık TÜFE (seri kodu bağlandığında)"}
  - {name: reel_fonlama_faizi, op: spread, inputs: [aofm, tufe_yoy], note: "Genel finansman koşulu"}
  - {name: guven_sapma_12, op: gap, inputs: [tuketici_guveni], window: 12, note: "Tüketici güveninin son 12 ay ortalamasından sapması"}
  - {name: kart_arac_z_24, op: zscore, inputs: [kart_arac_reel_yoy], window: 24, note: "Araç harcamasının son 24 aya göre z-score'u (talep momentum'u)"}
events:
  - {name: otv_indirimi_2018, start: "2018-11", end: "2019-06", kind: step, note: "Binek araçlarda geçici ÖTV indirimi (iki kez uzatıldı, 30 Haziran 2019'da sona erdi)", source: "Resmî Gazete; basın (birgun.net, takvim.com.tr, 2019-03-21)"}
