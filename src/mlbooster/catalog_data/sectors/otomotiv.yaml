id: otomotiv
name: Otomotiv
macro_features:
  - {name: usdtry_logdiff, source: evds3, series: TP.DK.USD.A, transform: log_diff, agg: avg}
  - {name: eurtry_logdiff, source: evds3, series: TP.DK.EUR.A, transform: log_diff, agg: avg}
  - {name: tufe_yoy, source: evds3, series: TP.TUKFIY2025.GENEL, transform: yoy_pct}
  - {name: aofm, source: evds3, series: TP.APIFON4, transform: level, agg: avg}
  - {name: aofm_son, source: evds3, series: TP.APIFON4, transform: level, agg: last}
  - {name: tasit_kredisi_faizi, source: evds3, discover_hint: "Taşıt kredisi faiz oranı"}
  - {name: tuketici_guveni, source: evds3, discover_hint: "Tüketici güven endeksi"}
  - {name: osd_binek_uretim_yoy, source: evds3, series: TP.UR.S08, transform: yoy_pct}
  - {name: kart_arac_reel_yoy, source: evds3, series: TP.KKHARTUT.KT3, transform: yoy_pct, agg: avg, real: true}
  - {name: kapasite_kullanim, source: evds3, series: TP.KKO.MA, transform: level}
sector_sources: [odmd]
market_share_sources:
  - {source: odmd, metric: "marka / model / segment satış adedi payı"}
ml_use_cases: ["Talep ve satış tahmini", "Fiyat esnekliği"]
