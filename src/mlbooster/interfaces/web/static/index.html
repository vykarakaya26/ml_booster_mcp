<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="mlb-token" content="{{TOKEN}}">
  <title>ML Booster Paneli</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Bölümler">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <strong>ML Booster</strong>
          <small>Türkiye veri paneli · v{{VERSION}}</small>
        </div>
      </div>
      <nav>
        <a href="#harita" data-view="harita">Sektör haritası</a>
        <a href="#panel" data-view="panel">Feature paneli</a>
        <a href="#model" data-view="model">Model karşılaştırma</a>
        <a href="#kalite" data-view="kalite">Veri kalitesi</a>
        <a href="#saglik" data-view="saglik">Kaynak durumu</a>
        <span class="nav-soon" title="Pazar payı analizi ayrı bir dalda geliştiriliyor">Pazar payı ve rakipler <em>yakında</em></span>
      </nav>
      <p class="sidebar-note">Veriler yalnızca bu bilgisayarda işlenir. Kaynak atfı: TCMB EVDS, BIS, OECD ve katalogdaki diğer kurumlar.</p>
    </aside>

    <div class="main">
      <header class="toolbar">
        <label class="field">
          <span>Sektör</span>
          <select id="sector" aria-label="Sektör"></select>
        </label>
        <label class="field">
          <span>Başlangıç</span>
          <input id="start" type="month" aria-label="Başlangıç ayı">
        </label>
        <label class="field">
          <span>Bitiş</span>
          <input id="end" type="month" aria-label="Bitiş ayı (boş: bugün)">
        </label>
        <div class="toolbar-spacer"></div>
        <button id="theme" class="ghost" type="button" aria-label="Tema değiştir">Tema</button>
      </header>

      <div id="notice" class="notice" role="status" hidden></div>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
</body>
</html>
