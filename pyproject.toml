[build-system]
# hatchling kaynak ağacına (egg-info/build) yazmaz: plugin dizininden `uvx --from` ile kurulurken önemli.
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mlbooster"
version = "0.5.0"
description = "ML Booster Map: Türkiye için ücretsiz veri kaynakları haritası ve ML'e hazır panel üretici"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=2.0",
    "pyyaml>=6",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
mlbooster = "mlbooster.interfaces.cli:app"
mlbooster-mcp = "mlbooster.interfaces.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlbooster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["live: gerçek uçlara giden contract testleri (EVDS_API_KEY gerekir)"]
addopts = "-m 'not live' --import-mode=importlib"
