[build-system]
# hatchling does not write into the source tree (egg-info/build): this matters when installing from the plugin directory with `uvx --from`.
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mlbooster"
version = "0.26.0"
description = "ML Booster Map: map of free data sources for Turkey and builder of ML-ready panels and derived features"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "certifi>=2024.2.2",  # TLS roots; imported directly by http_client
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=2.0",
    "pyyaml>=6",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "mcp>=2.0,<3",
    "starlette>=0.40",  # local web panel (already pulled in by mcp)
    "uvicorn>=0.31",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "cryptography>=42",  # RS256 signing of Google service-account JWTs (already pulled in by pdfplumber)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
mlbooster = "mlbooster.interfaces.cli:app"
mlbooster-mcp = "mlbooster.interfaces.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlbooster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["live: contract tests against real endpoints (EVDS and EPİAŞ tests need their credentials; others skip without them)"]
addopts = "-m 'not live' --import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Same rule families as the skill-suite workspace (pycodestyle, pyflakes, isort, pyupgrade, bugbear).
# E501 is off: hand-aligned tables are kept as written and no formatter is enforced.
select = ["E", "F", "I", "UP", "B", "RUF100", "RUF022"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Skill scripts run on the system Python (>=3.10) with the stdlib only: no py312-only rewrites there.
"skills/**/*.py" = ["UP"]

[tool.ruff.lint.isort]
known-first-party = ["mlbooster"]

[tool.coverage.run]
source = ["mlbooster"]
branch = true
