[build-system]
# hatchling does not write into the source tree (egg-info/build): this matters when installing from the plugin directory with `uvx --from`.
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mlbooster"
version = "0.5.0"
description = "ML Booster Map: map of free data sources for Turkey and builder of ML-ready panels"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=2.0",
    "pyyaml>=6",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
mlbooster = "mlbooster.interfaces.cli:app"
mlbooster-mcp = "mlbooster.interfaces.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlbooster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["live: contract tests against real endpoints (requires EVDS_API_KEY)"]
addopts = "-m 'not live' --import-mode=importlib"
