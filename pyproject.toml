[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mlbooster"
version = "0.1.0"
description = "ML Booster Map: Türkiye için ücretsiz veri kaynakları haritası ve ML'e hazır panel üretici"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=2.0",
    "pyyaml>=6",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
mlbooster = "mlbooster.cli:app"
mlbooster-mcp = "mlbooster.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: gerçek uçlara giden contract testleri (EVDS_API_KEY gerekir)"]
addopts = "-m 'not live'"

[tool.setuptools.package-data]
mlbooster = ["catalog_data/sources/*.yaml", "catalog_data/sectors/*.yaml"]
